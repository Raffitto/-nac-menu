# Same build for nacmenu.netlify.app, nac-khobar-reviews.netlify.app, and branch sites.
# In Netlify UI: Site configuration → Build & deploy → Branch = main, Command/Publish below.

[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Never cache shell or pre-React routing script (old bundles stuck otherwise)
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"

[[headers]]
  for = "/review-routing.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"

# Hashed CRA assets are immutable
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
