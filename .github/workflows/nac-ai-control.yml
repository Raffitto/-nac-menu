name: NAC AI Control Worker

on:
  workflow_dispatch:

concurrency:
  group: nac-ai-control
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  run-once:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/ask-nac-fabric-founding-day
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci --ignore-scripts; else npm install --ignore-scripts; fi

      - name: Deterministic worker (no model)
        run: node scripts/ai-control-worker.mjs

      - name: Commit handoff if dirty
        run: |
          git config user.name "nac-ai-control-worker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-control supabase/functions/_shared/companyIntelligence/externalReality/ossReferenceRegistry.ts || true
          if git diff --cached --quiet; then
            echo "No control-plane file changes"
          else
            git commit -m "feat(ai-control): worker handoff for current NEXT_TASK"
            git push
          fi

      - name: Control Room comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUE=$(node -e "const s=require('./ai-control/STATE.json'); process.stdout.write(String(s.controlRoomIssue||''))")
          if [ -z "$ISSUE" ] || [ "$ISSUE" = "null" ]; then echo "No controlRoomIssue yet"; exit 0; fi
          SHA=$(git rev-parse HEAD)
          gh issue comment "$ISSUE" --body "Worker run on \`$SHA\`. See \`ai-control/LAST_HANDOFF.md\`."
