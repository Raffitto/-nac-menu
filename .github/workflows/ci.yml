name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: npm ci, Jest, Deno tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          # Node 24 (Active LTS). The Edge-orchestrator routing tests import .ts
          # files under Node (type stripping), which needs Node >= 22.6.
          node-version: "24"
          cache: npm

      - name: Install (lockfile only)
        run: npm ci

      - name: Jest (react-scripts)
        run: npx react-scripts test --watchAll=false

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Deno tests (supabase/functions, network denied)
        run: deno test --no-check --deny-net --allow-read --allow-env --permit-no-files supabase/functions
