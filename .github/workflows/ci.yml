# Combined CI: security batch S1 and data-accuracy batch D1.
# - No secrets, read-only token, no deploy steps, pull_request (not pull_request_target).
# - Third-party actions pinned to full commit SHAs.
# Job ids are stable: no-secrets, edge-function-tests, d1-acceptance, full-suite.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-secrets:
    name: no-secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan tracked files for credentials
        run: bash scripts/check-no-secrets.sh
      - name: Self-test the scanner (synthetic runtime values, never printed)
        run: bash scripts/check-no-secrets.test.sh

  edge-function-tests:
    name: edge-function-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Edge Function tests (offline, --deny-net)
        run: >-
          deno test --no-check --deny-net --allow-env --allow-read
          --import-map=tests/edge-functions/import_map.json tests/edge-functions/

  # Gate for the D1 data-accuracy batch. Independent of the full Jest suite.
  d1-acceptance:
    name: D1 acceptance (Oracle T1-T28 + Deno)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 24 (Active LTS). The edge routing tests import .ts under Node
          # (type stripping), which needs Node >= 22.6.
          node-version: "24"
          cache: npm

      - name: Install (lockfile only)
        run: npm ci

      - name: October monthly Logbook parser regression
        run: node --test supabase/functions/_shared/vaultMonthlyLogbookWorkbook.test.js

      - name: Oracle D1 Jest tests
        run: npx react-scripts test --watchAll=false src/inventory/oracle-d1

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          # Exact version, not a moving range. v2.9.7 is the latest stable 2.x.
          deno-version: 2.9.7

      - name: Deno tests (supabase/functions, network denied)
        run: deno test --no-check --deny-net --allow-read --allow-env --permit-no-files supabase/functions

  full-suite:
    name: Full Jest suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install (lockfile only)
        run: npm ci

      - name: Jest (react-scripts)
        run: npx react-scripts test --watchAll=false
