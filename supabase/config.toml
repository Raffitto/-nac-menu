# Supabase CLI — nac-menu
# Docs: https://supabase.com/docs/guides/cli/config
#
# After `supabase link`, the CLI associates this folder with your remote project.
# Do not put service_role keys or database passwords in this file.

# Local project slug (distinct Docker stacks). Not your Dashboard project ref.
project_id = "nac-menu"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Match your hosted Postgres major version (Dashboard → Settings → Database).
major_version = 15

[db.migrations]
enabled = true
# schema_paths = []  # optional declarative schemas

[db.seed]
enabled = false
# sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_signup = true

[storage]
enabled = true
file_size_limit = "50MiB"

[realtime]
enabled = true

[analytics]
enabled = false
