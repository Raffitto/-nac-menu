    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>NAC Khobar</title>
  </head>
  <body>
    <script>
      (function (w) {
        var params = new URLSearchParams(w.location.search || "");
        var host = (w.location.hostname || "").toLowerCase();
        var reviewDomain = host.indexOf("review") !== -1;
        function has(k) {
          var v = params.get(k);
          return v != null && String(v).trim() !== "";
        }
        var isReview =
          params.get("app") === "review" ||
          has("s") ||
          has("staff") ||
          has("employee") ||
          has("employee_name") ||
          has("emp") ||
          has("slug") ||
          (has("role") && (has("store") || has("branch"))) ||
          (reviewDomain && (has("store") || has("branch") || has("s")));
        w.__NAC_REVIEW_MODE__ = isReview;
        console.log("ROUTING MODE", isReview ? "review" : "menu");
      })(window);
    </script>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
